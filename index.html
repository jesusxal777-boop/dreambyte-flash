<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>
        DreamByte Studios - Flash Experiment
    </title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <style>

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #061426;
            overflow: hidden;
        }

        #player {
            width: 100vw;
            height: 100vh;
        }

    </style>

</head>

<body>

    <div id="player"></div>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <script>

        window.RufflePlayer =
            window.RufflePlayer || {};

        window.addEventListener(
            "load",
            function () {

                const ruffle =
                    window.RufflePlayer.newest();

                const player =
                    ruffle.createPlayer();

                player.style.width = "100%";
                player.style.height = "100%";

                document
                    .getElementById("player")
                    .appendChild(player);

                player.ruffle().load(
                    "flash/demo.swf"
                );

            }
        );

    </script>

</body>

</html>
