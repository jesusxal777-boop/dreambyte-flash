name: Build Flash SWF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Apache Flex SDK
        run: |
          wget -q https://dlcdn.apache.org/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.tar.gz

          mkdir flex-sdk

          tar -xzf apache-flex-sdk-4.16.1-bin.tar.gz \
            -C flex-sdk \
            --strip-components=1

      - name: Download PlayerGlobal
        run: |
          mkdir -p playerglobal/32.0

          wget -q \
            https://fpdownload.macromedia.com/get/flashplayer/updaters/32/playerglobal32_0.swc \
            -O playerglobal/32.0/playerglobal.swc

      - name: Compile SWF
        env:
          PLAYERGLOBAL_HOME: ${{ github.workspace }}/playerglobal
        run: |
          mkdir -p flash

          flex-sdk/bin/mxmlc \
            -target-player=32.0 \
            -output=flash/demo.swf \
            -default-size 800 600 \
            -default-frame-rate 30 \
            src/Main.as

      - name: Upload SWF
        uses: actions/upload-artifact@v4
        with:
          name: dreambyte-flash
          path: flash/demo.swf